name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # 提交进仓库的 lib/client.js 必须与 src/entry.jsx 一致
      - run: npm run check:client
      - run: npm run check
      - run: npm run smoke
